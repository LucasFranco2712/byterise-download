<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteRise</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #222;
      text-align: center;
    }
    header {
      background-color: #1675c5;
      color: white;
      padding: 18px;
    }
    h1 { margin: 0; font-size: 30px; }
    main { padding: 45px 15px; }
    p { line-height: 1.5; }
    a.botao {
      display: block;
      background-color: #1675c5;
      color: white;
      padding: 12px;
      margin: 12px auto;
      width: 220px;
      max-width: 85%;
      text-decoration: none;
    }
    a.botao:hover { background-color: #095c9f; }
  </style>
</head>
<body>
  <header>
    <h1>ByteRise</h1>
  </header>

  <main>
    <h2>Jogue ByteRise!</h2>
    <p>Baixe o jogo no Android ou jogue online.</p>
    <p id="status">Verificando seu dispositivo...</p>

    <a class="botao" id="android" href="https://github.com/LucasFranco2712/byterise-download/releases/latest/download/ByteRise.apk">Baixar para Android</a>
    <a class="botao" id="online" href="https://gx.games/games/iql6v6/com-karlsproplayes123s-byterise/tracks/2b437454-73b1-4b2b-8a3d-7e0c29b52f16/">Jogar online</a>

  </main>

  <script>
    const apk = document.getElementById('android').href;
    const online = document.getElementById('online').href;
    const android = /Android/i.test(navigator.userAgent);
    const teste = new URLSearchParams(window.location.search).has('teste');

    if (teste) {
      document.getElementById('status').textContent = 'Escolha como deseja jogar:';
    } else {
      document.getElementById('status').textContent = 'Abrindo o jogo...';
      window.location.replace(android ? apk : online);
    }
  </script>
</body>
</html>
